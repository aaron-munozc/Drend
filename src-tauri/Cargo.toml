[package]
name = "drend"
version = "1.0.0"
description = ""
authors = ["Aaron Muñoz"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "drend_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
stream_extractor = { git = "https://github.com/aaron-munozc/Stream-Extractor.git", branch = "main", features = ["reqwest-backend"] }
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-http = { version = "2.5.9", features = ["brotli", "cookies", "gzip"] }
tauri-plugin-log = { version = "2.8.0", features = ["colored"] }
serde = { version = "1", features = ["derive"] }
axum = "0.8.9"
serde_json = "1.0.150"
thiserror = "2.0.18"
log = "0.4.32"
tokio = { version = "1.52.3", features = ["full"] }
futures = "0.3.32"
regex = "1.12.4"
skia-safe = "0.97.2"
lru = "0.18.0"
parking_lot = "0.12.5"
rustc-hash = "2.1.2"
rayon = "1.12.0"
image = "0.25.10"
once_cell = "1.21.4"
crossbeam-channel = "0.5.15"
which = "8.0.4"
tauri-plugin-dialog = "2.7.1"
reqwest = "0.13.4"
futures-util = "0.3.32"
tokio-stream = "0.1.18"
arrayvec = "0.7.6"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "2"

# Used for extracting .zip archives on Windows and macOS
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
zip = "2.2.2"

# Used for extracting .tar.xz archives on Linux
[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
tar = "0.4.43"
xz2 = "0.1.7"
